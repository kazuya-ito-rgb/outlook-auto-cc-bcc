<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動CC/BCC設定</title>
    <!-- Office JavaScript API -->
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js" type="text/javascript"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 16px;
            margin: 0;
            color: #333;
            background-color: #faf9f8;
        }
        h2 {
            font-size: 18px;
            margin-top: 0;
            color: #0078d4;
            border-bottom: 2px solid #0078d4;
            padding-bottom: 6px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .desc {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid #c8c6c4;
            border-radius: 4px;
            font-size: 13px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #0078d4;
            box-shadow: 0 0 0 1px #0078d4;
        }
        .checkbox-group {
            margin: 12px 0;
            display: flex;
            align-items: center;
        }
        .checkbox-group input {
            margin-right: 8px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0078d4;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background-color: #106ebe;
        }
        #status-message {
            margin-top: 12px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
            text-align: center;
        }
        .success {
            background-color: #dff6dd;
            color: #107c10;
        }
    </style>
</head>
<body>
    <h2>自動CC・BCC 設定</h2>
    <div class="form-group">
        <label for="ccInput">自動追加 CC</label>
        <div class="desc">セミコロン ( ; ) 区切りで複数入力可能</div>
        <input type="text" id="ccInput" placeholder="manager@example.com; team@example.com">
    </div>

    <div class="form-group">
        <label for="bccInput">自動追加 BCC</label>
        <div class="desc">セミコロン ( ; ) 区切りで複数入力可能</div>
        <input type="text" id="bccInput" placeholder="archive@example.com">
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="enabledCheck" checked>
        <label for="enabledCheck" style="margin: 0; font-weight: normal; cursor: pointer;">メール新規作成時の自動入力を有効にする</label>
    </div>

    <button id="saveBtn">設定を保存</button>

    <div id="status-message"></div>

    <script src="taskpane.js"></script>
</body>
</html>
